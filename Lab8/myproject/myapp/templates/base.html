    <style>
body {
        font-family: 'Google Sans', 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0d47a1 0%, #4a148c 60%, #000000 100%);
        color: #f8f9fa;
        min-height: 100vh;
      }
      .banner { position: relative; height: 260px; overflow: hidden; }
      .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .banner-overlay { background: rgba(0, 0, 0, 0.45); }
      /* ===== Footer ===== */
footer{
    background:#222;
    color:white;
    padding:40px 10%;
    text-align:center;
}
.social-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 15px;
  }
  
  .social-icon {
    font-size: 24px;
    color: #555; /* สีพื้นฐาน */
    transition: 0.3s;
  }
  
  /* สีเมื่อ Hover */
  .social-icon.line:hover { color: #00b900; }
  .social-icon.instagram:hover { color: #e4405f; }
  .social-icon.facebook:hover { color: #1877f2; }
  .social-icon.x-twitter:hover { color: #000000; }
  .footer-icons {
    display: flex;
    gap: 15px; /* เว้นระยะห่างระหว่างไอคอน */
    justify-content: center;
    align-items: center;
    padding: 20px 0;
  }
  
  .icon-img {
    width: 32px;  /* ปรับขนาดความกว้างตามต้องการ */
    height: 32px; /* ปรับขนาดความสูงตามต้องการ */
    transition: transform 0.3s ease, filter 0.3s ease;
    object-fit: contain;
  }
  
  /* เอฟเฟกต์เมื่อเอาเมาส์ไปวาง */
  .icon-img:hover {
    transform: translateY(-5px); /* ให้ไอคอนลอยขึ้นเล็กน้อย */
    filter: brightness(1.2);    /* ให้ดูสว่างขึ้น */
  }
    </style>
    <title>{% block title %}MyProject{% endblock %}</title>
</head>
