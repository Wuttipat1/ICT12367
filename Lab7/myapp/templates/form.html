<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>บันทึกข้อมูลผู้ใช้</title>
</head>
<body>

    <div class="form-container">
        
        <h2>บันทึกข้อมูลผู้ใช้</h2>

        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="fullname"><b>Full Name</b></label><br>
                <input type="text" id="fullname" name="fullname" style="width: 100%;">
            </div>

            <br>

            <div class="form-group">
                <label for="email"><b>Email</b></label><br>
                <input type="email" id="email" name="email" style="width: 100%;">
            </div>

            <br>

            <div class="form-group">
                <label for="position"><b>Position</b></label><br>
                <select id="position" name="position" style="width: 100%;">
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                    <option value="manager">Manager</option>
                </select>
            </div>

            <br>

            <div class="form-group">
                <label for="phone"><b>Phone Number</b></label><br>
                <input type="tel" id="phone" name="phone" style="width: 100%;">
            </div>

            <br><br>

            <button type="submit" style="width: 100%; background-color: #28a745; color: white; border: none; padding: 10px; cursor: pointer;">
                Submit
            </button>

        </form>
    </div>

</body>
</html>
